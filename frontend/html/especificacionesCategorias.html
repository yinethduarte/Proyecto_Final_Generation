<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link
      rel="icon"
      type="image/png"
      href="/frontend/css/img/iconoagon-2@2x.png"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="/frontend/css/especificacionesCategorias.css"
    />
  </head>
  <nav id="navbar-container"></nav>
  <body>
    <center>
      <div class="close-container">
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
          style="margin: 30px 0 0 30px"
        ></button>
        <span style="font-size: 22px">Regresar</span>
      </div>
      <div class="product-container">
        <div class="product-image" id="divImagenVideo"></div>
        <div class="product-details">
          <h1 class="product-name" id="nomProducto">Nombre del Producto</h1>
          <p class="product-price" id="precProducto">$99.99</p>
          <p class="product-description" id="desProducto">
            Esta es la descripción del producto. Aquí puedes detallar las
            características y beneficios del producto.
          </p>
          <!-- <button class="add-to-cart">Agregar al carrito</button> -->
        </div>
      </div>
      <div id="catalogoDetalles">
        <!-- Productos se generarán aquí -->
      </div>
    </center>
    <footer></footer>
    <script src="/frontend/js/especificacionesCategorias.js"></script>
    <script src="/frontend/js/navbar.js"></script>
    <script src="/frontend/js/footer.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
