<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Personalizacion -->
    <title>Finalizar compra</title>
    <link
      rel="icon"
      type="image/png"
      href="/frontend/css/img/iconoagon-2@2x.png"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- sweetalert -->
    <link
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.0/dist/sweetalert2.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.0/dist/sweetalert2.all.min.js"></script>

    <!-- Estilos -->
    <link rel="stylesheet" href="/frontend/css/body.css" />
    <link rel="stylesheet" href="/frontend/css/finalizarCompra.css" />

    <script src="/frontend/js/navbar.js"></script>
    <script src="/frontend/js/footer.js"></script>
  </head>

  <body>
    <nav id="navbar-container"></nav>
    <div class="d-flex flex-column align-items-center mt-sm-5">
      <section
        class="pedido-final-contenedor container row d-flex justify-content-center"
      >
        <div class="contenedor-form-compra col-12 col-lg-5">
          <form class="finalizarCompra-form">
            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label"
                >Correo Electrónico</label
              >
              <input
                type="email"
                class="form-control"
                id="email"
                aria-describedby="emailHelp"
                placeholder="Ingrese su correo electrónico"
              />
              <div id="emailHelp" class="form-text">
                Nunca compartiremos su correo electrónico con nadie más.
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Tipo de Check</label>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  name="tipoCheck"
                  id="opcion1"
                  value="opcion1"
                />
                <label class="form-check-label" for="opcion1">Envía</label>
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  name="tipoCheck"
                  id="opcion2"
                  value="opcion2"
                />
                <label class="form-check-label" for="opcion2"
                  >Transportadora local</label
                >
              </div>
            </div>
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input
                type="text"
                class="form-control"
                id="nombre"
                placeholder="Ingrese su nombre"
              />
            </div>
            <div class="mb-3">
              <label for="apellidos" class="form-label">Apellidos</label>
              <input
                type="text"
                class="form-control"
                id="apellidos"
                placeholder="Ingrese sus apellidos"
              />
            </div>
            <div class="mb-3">
              <label for="documento" class="form-label"
                >Documento de Identidad</label
              >
              <input
                type="number"
                class="form-control"
                id="documento"
                placeholder="Ingrese su documento de identidad"
              />
            </div>
            <div class="mb-3">
              <label for="direccion" class="form-label">Dirección</label>
              <input
                type="text"
                class="form-control"
                id="direccion"
                placeholder="Ingrese su dirección"
              />
            </div>
            <div class="mb-3">
              <label for="detallesDireccion" class="form-label"
                >Detalles de Dirección</label
              >
              <input
                type="text"
                class="form-control"
                id="detallesDireccion"
                placeholder="Ingrese detalles adicionales de su dirección"
              />
            </div>
            <div class="mb-3">
              <label for="ciudad" class="form-label">Ciudad</label>
              <input
                type="text"
                class="form-control"
                id="ciudad"
                placeholder="Ingrese su ciudad"
              />
            </div>
            <div class="mb-3">
              <label for="telefono" class="form-label">Teléfono</label>
              <input
                type="text"
                class="form-control"
                id="telefono"
                placeholder="Ingrese su número de teléfono"
              />
            </div>
            <input
              class="finalizar-compra"
              type="submit"
              value="Finalizar Compra"
            />
          </form>
        </div>
        <div class="resumen-pedido col-12 col-lg-5"></div>
      </section>
    </div>
    <footer></footer>
    <script src="/frontend/js/finalizarcompra.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
